<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#F2EEE6"/>
<text x="74" y="84" text-anchor="start" font-family="STZhongsong" font-size="20" font-weight="normal" fill="#963B31">种植园经济</text>
<text x="72" y="150" text-anchor="start" font-family="KaiTi" font-size="50" font-weight="normal" fill="#171817">种植园不是自然产物</text>
<text x="74" y="194" text-anchor="start" font-family="STZhongsong" font-size="24" font-weight="normal" fill="#4F4E49">烟草、奴隶贸易与法律，共同把南方推进种植园时代。</text>
<path d="M 88 360 C 205 332, 260 373, 327 288 S 454 315, 558 342 S 705 250, 810 286 S 978 338, 1107 219" fill="none" stroke="#20374D" stroke-width="3.5"/>
<circle cx="92" cy="359" r="7" fill="#963B31"/>
<line x1="92" y1="347" x2="92" y2="377" stroke="#20374D" stroke-width="1.4"/>
<text x="92" y="287" text-anchor="start" font-family="STZhongsong" font-size="31" font-weight="normal" fill="#963B31">1612</text>
<text x="92" y="317" text-anchor="middle" font-family="STZhongsong" font-size="18" font-weight="normal" fill="#171817"><tspan x="92" dy="0">首批烟草试种成功</tspan></text>
<circle cx="327" cy="288" r="7" fill="#963B31"/>
<line x1="327" y1="276" x2="327" y2="306" stroke="#20374D" stroke-width="1.4"/>
<text x="327" y="326" text-anchor="start" font-family="STZhongsong" font-size="31" font-weight="normal" fill="#963B31">1619</text>
<text x="327" y="358" text-anchor="start" font-family="STZhongsong" font-size="18" font-weight="normal" fill="#171817">约 20 名非洲人被荷兰人贩入</text>
<circle cx="558" cy="342" r="7" fill="#963B31"/>
<line x1="558" y1="330" x2="558" y2="360" stroke="#20374D" stroke-width="1.4"/>
<text x="558" y="270" text-anchor="start" font-family="STZhongsong" font-size="31" font-weight="normal" fill="#963B31">1661–70</text>
<text x="558" y="300" text-anchor="middle" font-family="STZhongsong" font-size="18" font-weight="normal" fill="#171817"><tspan x="558" dy="0">终身与世袭奴役写入殖民地法律</tspan></text>
<circle cx="810" cy="286" r="7" fill="#963B31"/>
<line x1="810" y1="274" x2="810" y2="304" stroke="#20374D" stroke-width="1.4"/>
<text x="810" y="324" text-anchor="start" font-family="STZhongsong" font-size="31" font-weight="normal" fill="#963B31">1787</text>
<text x="810" y="356" text-anchor="start" font-family="STZhongsong" font-size="18" font-weight="normal" fill="#171817">宪法拖延废奴，并保护奴隶主追索逃奴</text>
<circle cx="1062" cy="219" r="7" fill="#963B31"/>
<line x1="1062" y1="207" x2="1062" y2="237" stroke="#20374D" stroke-width="1.4"/>
<text x="1062" y="147" text-anchor="start" font-family="STZhongsong" font-size="31" font-weight="normal" fill="#963B31">18 世纪末</text>
<text x="1062" y="177" text-anchor="middle" font-family="STZhongsong" font-size="18" font-weight="normal" fill="#171817"><tspan x="1062" dy="0">南北经济</tspan><tspan x="1062" dy="25.2">联系日益紧密</tspan></text>
<rect x="74" y="552" width="9" height="93" fill="#963B31"/>
<text x="107" y="587" text-anchor="start" font-family="KaiTi" font-size="27" font-weight="normal" fill="#171817"><tspan x="107" dy="0">气候决定什么样的作物能够生长，</tspan><tspan x="107" dy="43.2">资本、法律和暴力决定谁被迫劳动。</tspan></text>
<line x1="74" y1="654" x2="1206" y2="654" stroke="#BEB8AD" stroke-width="1"/>
<text x="74" y="691" font-family="STZhongsong" font-size="15" fill="#4D4B46">原文 p.1–3</text>
<text x="1206" y="691" text-anchor="end" font-family="STZhongsong" font-size="15" fill="#171817">03 / 12</text>
</svg>
