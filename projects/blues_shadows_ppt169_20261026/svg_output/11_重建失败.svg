<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#171817"/>
<text x="74" y="84" text-anchor="start" font-family="STZhongsong" font-size="20" font-weight="normal" fill="#963B31">重建失败</text>
<text x="72" y="150" text-anchor="start" font-family="KaiTi" font-size="50" font-weight="normal" fill="#FBFAF7">黑人再次成为“看不见的人”</text>
<path d="M 835 227 A 250 250 0 1 1 835 617" fill="none" stroke="#20374D" stroke-width="28"/>
<path d="M 902 270 A 185 185 0 1 1 902 574" fill="none" stroke="#963B31" stroke-width="8"/>
<path d="M 958 332 A 115 115 0 0 0 958 512" fill="none" stroke="#59615F" stroke-width="2"/>
<text x="1000" y="380" text-anchor="middle" font-family="KaiTi" font-size="26" font-weight="normal" fill="#C7D0D3">承诺</text>
<text x="1000" y="415" text-anchor="middle" font-family="KaiTi" font-size="26" font-weight="normal" fill="#C7D0D3">撤离</text>
<text x="1000" y="450" text-anchor="middle" font-family="KaiTi" font-size="26" font-weight="normal" fill="#C7D0D3">回潮</text>
<text x="76" y="224" text-anchor="start" font-family="STZhongsong" font-size="24" font-weight="normal" fill="#E7E3DB"><tspan x="76" dy="0">军队撤离后，旧种植园主重新掌握州政府。</tspan><tspan x="76" dy="37.2">三 K 党、种族隔离和种族暴力卷土重来。</tspan><tspan x="76" dy="37.2">“民主”和“平等”停留在选票的语言里，</tspan><tspan x="76" dy="37.2">没有兑现为活生生的社会现实。</tspan></text>
<text x="76" y="544" text-anchor="start" font-family="KaiTi" font-size="31" font-weight="normal" fill="#FBFAF7">“在黑人的劳动打上屈辱烙印的地方，</text>
<text x="76" y="582" text-anchor="start" font-family="KaiTi" font-size="31" font-weight="normal" fill="#FBFAF7">白人的劳动也不能得到解放。”</text>
<text x="76" y="616" text-anchor="start" font-family="STZhongsong" font-size="16" font-weight="normal" fill="#B9C4C9">马克思语，转引自原文 p.9</text>
<line x1="74" y1="654" x2="1206" y2="654" stroke="#5E7687" stroke-width="1"/>
