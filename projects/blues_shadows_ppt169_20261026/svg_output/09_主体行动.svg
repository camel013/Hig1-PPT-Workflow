<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#F2EEE6"/>
<text x="570" y="84" text-anchor="start" font-family="STZhongsong" font-size="20" font-weight="normal" fill="#963B31">黑人的主体行动</text>
<text x="568" y="150" text-anchor="start" font-family="KaiTi" font-size="50" font-weight="normal" fill="#171817">解放来自持续斗争</text>
<text x="74" y="300" text-anchor="start" font-family="STZhongsong" font-size="105" font-weight="normal" fill="#963B31">数十万</text>
<text x="78" y="360" text-anchor="start" font-family="KaiTi" font-size="27" font-weight="normal" fill="#171817">黑人士兵参战</text>
<text x="78" y="397" text-anchor="start" font-family="STZhongsong" font-size="18" font-weight="normal" fill="#4F4E49">把战争推进到黑人解放的目标</text>
<text x="568" y="238" text-anchor="start" font-family="STZhongsong" font-size="20" font-weight="normal" fill="#963B31">01</text>
<text x="618" y="238" text-anchor="start" font-family="KaiTi" font-size="27" font-weight="normal" fill="#20374D">组织废奴</text>
<text x="618" y="271" text-anchor="start" font-family="STZhongsong" font-size="19" font-weight="normal" fill="#4F4E49">道格拉斯等黑人知识分子推动废奴组织与集会。</text>
<line x1="568" y1="308" x2="1206" y2="308" stroke="#C9D1D2" stroke-width="1"/>
<text x="568" y="356" text-anchor="start" font-family="STZhongsong" font-size="20" font-weight="normal" fill="#963B31">02</text>
<text x="618" y="356" text-anchor="start" font-family="KaiTi" font-size="27" font-weight="normal" fill="#20374D">参与战争</text>
<text x="618" y="389" text-anchor="start" font-family="STZhongsong" font-size="19" font-weight="normal" fill="#4F4E49">黑人的逃亡和反抗，成为战争转向解放的重要力量。</text>
<line x1="568" y1="426" x2="1206" y2="426" stroke="#C9D1D2" stroke-width="1"/>
<text x="568" y="474" text-anchor="start" font-family="STZhongsong" font-size="20" font-weight="normal" fill="#963B31">03</text>
<text x="618" y="474" text-anchor="start" font-family="KaiTi" font-size="27" font-weight="normal" fill="#20374D">切断棉花</text>
<text x="618" y="507" text-anchor="start" font-family="STZhongsong" font-size="19" font-weight="normal" fill="#4F4E49">英国工人顶住“棉业危机”，打击南方棉花出口。</text>
<line x1="568" y1="544" x2="1206" y2="544" stroke="#C9D1D2" stroke-width="1"/>
<text x="74" y="565" text-anchor="start" font-family="KaiTi" font-size="31" font-weight="normal" fill="#20374D">“为了自由和尊严，和联邦政府共同战斗！”</text>
<line x1="74" y1="654" x2="1206" y2="654" stroke="#BEB8AD" stroke-width="1"/>
<text x="74" y="691" font-family="STZhongsong" font-size="15" fill="#4D4B46">原文 p.7</text>
<text x="1206" y="691" text-anchor="end" font-family="STZhongsong" font-size="15" fill="#171817">09 / 12</text>
</svg>
