<text x="102" y="111" text-anchor="start" font-family="STZhongsong" font-size="21" font-weight="normal" letter-spacing="2" fill="#C7D0D3">历史中的文化回声</text>
<text x="68" y="311" text-anchor="start" font-family="KaiTi" font-size="102" font-weight="normal" fill="#FBFAF7">蓝调背后</text>
<text x="74" y="375" text-anchor="start" font-family="KaiTi" font-size="44" font-weight="normal" fill="#FBFAF7">影子中的人们</text>
<text x="76" y="458" text-anchor="start" font-family="STZhongsong" font-size="25" font-weight="normal" fill="#D7DEE0">一棵棉花、一部机器、一道法律，共同写进了声音。</text>
<text x="720" y="138" text-anchor="start" font-family="STZhongsong" font-size="104" font-weight="normal" fill="#963B31">“</text>
<text font-weight="normal" font-size="29" text-anchor="start" font-family="STZhongsong" fill="#FBFAF7" x="770" y="204">我的一生，我一直在创造它；</text><text font-weight="normal" font-size="29" text-anchor="start" font-family="STZhongsong" fill="#FBFAF7" x="770" y="251.8">我的一生，白种人拿走了它。</text><text x="770" y="305" text-anchor="start" font-family="STZhongsong" font-size="18" font-weight="normal" fill="#C7D0D3">Bessie Brown · Song From A Cotton Field</text>
<text x="76" y="612" text-anchor="start" font-family="STZhongsong" font-size="16" font-weight="normal" fill="#B9C4C9">依据《“蓝调”背后——影子中的人们》精选</text>
<text x="1206" y="691" text-anchor="end" font-family="STZhongsong" font-size="15" fill="#171817">01 / 12</text>
