<text x="74" y="90" text-anchor="start" font-family="STZhongsong" font-size="20" font-weight="normal" fill="#963B31">尾声</text>
<text x="72" y="175" text-anchor="start" font-family="KaiTi" font-size="72" font-weight="normal" fill="#171817">谁在歌唱</text>
<text font-weight="normal" font-size="55" text-anchor="start" font-family="KaiTi" fill="#171817" x="74" y="287">人是宇宙和声中</text><text font-weight="normal" font-size="55" text-anchor="start" font-family="KaiTi" fill="#171817" x="74" y="368.4">一个响亮有力的“是”字。</text><text x="76" y="410" text-anchor="start" font-family="STZhongsong" font-size="18" font-weight="normal" fill="#4F4E49">易卜拉欣·弗朗茨·法农</text>
<text font-weight="normal" font-size="25" text-anchor="start" font-family="STZhongsong" fill="#20374D" x="74" y="491">蓝调承接种植园里的圣歌与民歌，</text><text font-weight="normal" font-size="25" text-anchor="start" font-family="STZhongsong" fill="#20374D" x="74" y="529.8">把共同的哀愁、劳动与愤怒留在声音里。</text><line x1="74" y1="654" x2="1206" y2="654" stroke="#BEB8AD" stroke-width="1" />
<text x="74" y="691" font-family="STZhongsong" font-size="15" fill="#4D4B46">原文 p.1、p.9 · 12 页精选</text>
