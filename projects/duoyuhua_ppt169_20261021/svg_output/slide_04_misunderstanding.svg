<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" opacity="1.0"/>
<text x="80" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="2" opacity="1.0">04 / 12</text>
<text x="1200" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">THE HISTORICAL MISUNDERSTANDING</text>
<line x1="80" y1="96" x2="1200" y2="96" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="176" font-family="华文楷体" font-size="54" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">历史的误会</text>
<text x="80" y="272" font-family="华文楷体" font-size="40" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">我其实是一个很平凡的文人，</text>
<text x="80" y="336" font-family="华文楷体" font-size="40" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">竟虚负了某某党的领袖的名声十来年。</text>
<text x="80" y="418" font-family="华文楷体" font-size="40" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">这不是“历史的误会”，是什么呢？</text>
<line x1="80" y1="470" x2="1200" y2="470" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="540" font-family="Arial" font-size="84" font-weight="400" fill="#E2231A" text-anchor="start" letter-spacing="0" opacity="1.0">15</text>
<text x="198" y="528" font-family="等线" font-size="20" font-weight="700" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">年</text>
<text x="198" y="556" font-family="华文中宋" font-size="16" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">勉强做着政治工作</text>
<text x="680" y="540" font-family="Arial" font-size="84" font-weight="400" fill="#E2231A" text-anchor="start" letter-spacing="0" opacity="1.0">10</text>
<text x="798" y="528" font-family="等线" font-size="20" font-weight="700" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">余年</text>
<text x="798" y="556" font-family="华文中宋" font-size="16" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">虚负领袖之名</text>
<line x1="80" y1="664" x2="1200" y2="664" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="692" font-family="华文中宋" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="1" opacity="1.0">多余的话</text>
<text x="1200" y="692" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">04 / 12</text>
</svg>
