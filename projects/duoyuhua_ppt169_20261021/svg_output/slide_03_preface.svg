<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" opacity="1.0"/>
<text x="80" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="2" opacity="1.0">03 / 12</text>
<text x="1200" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">PREFACE / 代序</text>
<line x1="80" y1="96" x2="1200" y2="96" stroke="#D9D9D4" stroke-width="1"/>
<text x="62" y="542" font-family="Arial" font-size="238" font-weight="400" fill="#ECECE8" text-anchor="start" letter-spacing="0" opacity="1.0">03</text>
<text x="430" y="210" font-family="华文楷体" font-size="44" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">话既然是多余的，</text>
<text x="430" y="268" font-family="华文楷体" font-size="44" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">又何必说呢？</text>
<line x1="430" y1="300" x2="700" y2="300" stroke="#E2231A" stroke-width="3"/>
<text x="430" y="368" font-family="华文中宋" font-size="22" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">已经是走到了生命的尽期。余剩的日子，</text>
<text x="430" y="404" font-family="华文中宋" font-size="22" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">不但不能按照年份来算，</text>
<text x="430" y="440" font-family="华文中宋" font-size="22" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">甚至不能按星期来算了。</text>
<text x="430" y="512" font-family="华文中宋" font-size="20" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">这是我最后“谈天”的机会呢！</text>
<text x="430" y="544" font-family="华文中宋" font-size="15" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">（一九三五·五·一七于汀州狱中）</text>
<line x1="80" y1="664" x2="1200" y2="664" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="692" font-family="华文中宋" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="1" opacity="1.0">多余的话</text>
<text x="1200" y="692" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">03 / 12</text>
</svg>
