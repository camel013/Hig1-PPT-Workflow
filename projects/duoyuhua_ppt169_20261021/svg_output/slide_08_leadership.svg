<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" opacity="1.0"/>
<text x="80" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="2" opacity="1.0">08 / 12</text>
<text x="1200" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">POLITICAL LEADERSHIP</text>
<line x1="80" y1="96" x2="1200" y2="96" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="176" font-family="华文楷体" font-size="54" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">五年</text>
<text x="80" y="300" font-family="Arial" font-size="28" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">1927</text>
<text x="1200" y="300" font-family="Arial" font-size="28" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="0" opacity="1.0">1931</text>
<line x1="80" y1="318" x2="1200" y2="318" stroke="#111111" stroke-width="2"/>
<line x1="80.0" y1="312" x2="80.0" y2="326" stroke="#111111" stroke-width="2"/>
<line x1="360.0" y1="312" x2="360.0" y2="326" stroke="#111111" stroke-width="2"/>
<line x1="640.0" y1="312" x2="640.0" y2="326" stroke="#111111" stroke-width="2"/>
<line x1="920.0" y1="312" x2="920.0" y2="326" stroke="#111111" stroke-width="2"/>
<line x1="1200.0" y1="312" x2="1200.0" y2="326" stroke="#111111" stroke-width="2"/>
<text x="80" y="426" font-family="等线" font-size="30" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">整整五年，我居然当了中国共产党的领袖之一，</text>
<text x="80" y="472" font-family="等线" font-size="30" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">最后三年甚至仿佛是最主要的领袖。</text>
<text x="80" y="552" font-family="华文中宋" font-size="19" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">“你们饶了我吧，我实在没有兴趣和能力负担这个领导工作了。”</text>
<text x="80" y="584" font-family="华文中宋" font-size="19" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">但是，终于没有说出口。</text>
<line x1="80" y1="664" x2="1200" y2="664" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="692" font-family="华文中宋" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="1" opacity="1.0">多余的话</text>
<text x="1200" y="692" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">08 / 12</text>
</svg>
