<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" opacity="1.0"/>
<text x="80" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="2" opacity="1.0">07 / 12</text>
<text x="1200" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">MARXISM / 1923—1927</text>
<line x1="80" y1="96" x2="1200" y2="96" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="176" font-family="华文楷体" font-size="54" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">我和马克思主义</text>
<text x="80" y="262" font-family="华文楷体" font-size="40" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">我对这些学问，</text>
<text x="80" y="322" font-family="华文楷体" font-size="40" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">的确只知道一点皮毛。</text>
<text x="80" y="396" font-family="华文中宋" font-size="18" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">当时我只是根据几本外国文的书籍转译一下，编了一些讲义。</text>
<line x1="80" y1="452" x2="1200" y2="452" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="524" font-family="等线" font-size="32" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">从那时候起，我没有自己的思想。</text>
<text x="80" y="584" font-family="等线" font-size="34" font-weight="700" fill="#E2231A" text-anchor="start" letter-spacing="0" opacity="1.0">（我以中央的思想为思想。）</text>
<line x1="80" y1="664" x2="1200" y2="664" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="692" font-family="华文中宋" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="1" opacity="1.0">多余的话</text>
<text x="1200" y="692" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">07 / 12</text>
</svg>
