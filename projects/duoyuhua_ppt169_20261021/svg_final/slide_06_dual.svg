<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" opacity="1.0"/>
<text x="80" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="2" opacity="1.0">06 / 12</text>
<text x="1200" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">THE FRAIL DUAL SELF</text>
<line x1="80" y1="96" x2="1200" y2="96" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="176" font-family="华文楷体" font-size="54" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">脆弱的二元人物</text>
<rect x="80" y="226" width="4" height="150" fill="#E2231A" opacity="1.0"/>
<text x="108" y="268" font-family="华文楷体" font-size="34" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">一只羸弱的马拖着几千斤的辎重车，</text>
<text x="108" y="316" font-family="华文楷体" font-size="34" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">走上了险峻的山坡，一步步地往上爬。</text>
<text x="108" y="364" font-family="华文中宋" font-size="22" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">要往后退是不可能，要再往前去是实在不能胜任了。</text>
<line x1="80" y1="470" x2="1200" y2="470" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="590" font-family="Arial" font-size="110" font-weight="400" fill="#E2231A" text-anchor="start" letter-spacing="0" opacity="1.0">36</text>
<text x="230" y="566" font-family="等线" font-size="22" font-weight="700" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">岁</text>
<text x="230" y="596" font-family="华文中宋" font-size="18" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">自觉已经非常地衰惫，丝毫青年壮年的兴趣都没有了</text>
<line x1="80" y1="664" x2="1200" y2="664" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="692" font-family="华文中宋" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="1" opacity="1.0">多余的话</text>
<text x="1200" y="692" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">06 / 12</text>
</svg>
