<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" opacity="1.0"/>
<text x="80" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="2" opacity="1.0">09 / 12</text>
<text x="1200" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">BLIND ACTIONISM / LI LISAN LINE</text>
<line x1="80" y1="96" x2="1200" y2="96" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="176" font-family="华文楷体" font-size="54" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">盲动主义和立三路线</text>
<text x="80" y="266" font-family="华文楷体" font-size="34" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">立三路线是我的许多错误观点</text>
<text x="80" y="310" font-family="华文楷体" font-size="34" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">——有人说是瞿秋白主义——逻辑的发展。</text>
<line x1="80" y1="382" x2="1200" y2="382" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="424" font-family="等线" font-size="26" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">盲动主义</text>
<text x="520" y="424" font-family="华文中宋" font-size="18" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">一九二八年初的判断错误</text>
<line x1="80" y1="460" x2="1200" y2="460" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="502" font-family="等线" font-size="26" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">立三路线</text>
<text x="520" y="502" font-family="华文中宋" font-size="18" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">左倾空谈掩盖右倾实质</text>
<line x1="80" y1="538" x2="1200" y2="538" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="580" font-family="等线" font-size="26" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">瞿秋白主义</text>
<text x="520" y="580" font-family="华文中宋" font-size="18" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">他人加之于我的命名</text>
<text x="80" y="636" font-family="等线" font-size="18" font-weight="700" fill="#E2231A" text-anchor="start" letter-spacing="0" opacity="1.0">我当然间接地负着立三路线的责任。</text>
<line x1="80" y1="664" x2="1200" y2="664" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="692" font-family="华文中宋" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="1" opacity="1.0">多余的话</text>
<text x="1200" y="692" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">09 / 12</text>
</svg>
