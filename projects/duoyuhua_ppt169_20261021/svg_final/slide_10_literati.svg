<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" opacity="1.0"/>
<text x="80" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="2" opacity="1.0">10 / 12</text>
<text x="1200" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">THE LITERATI</text>
<line x1="80" y1="96" x2="1200" y2="96" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="210" font-family="华文楷体" font-size="108" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">“文人”</text>
<rect x="80" y="266" width="330" height="5" fill="#E2231A" opacity="1.0"/>
<text x="80" y="352" font-family="等线" font-size="28" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">文人积习未除。</text>
<text x="80" y="392" font-family="等线" font-size="30" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">至多不过是个“读者”。</text>
<text x="80" y="446" font-family="华文中宋" font-size="18" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">假使能够仔细而郑重地，极忠实地翻译几部俄国文学名著，</text>
<text x="80" y="474" font-family="华文中宋" font-size="18" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">在汉字方面每字每句地斟酌着，也许不会“误人子弟”的。</text>
<line x1="80" y1="532" x2="1200" y2="532" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="580" font-family="华文中宋" font-size="18" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">这一个最愉快的梦想，比创作和评论方面再求得什么成就，要实际得多。</text>
<text x="80" y="614" font-family="华文中宋" font-size="18" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="0" opacity="1.0">可惜，恐怕现在这个可能已经“过时”了！</text>
<line x1="80" y1="664" x2="1200" y2="664" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="692" font-family="华文中宋" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="1" opacity="1.0">多余的话</text>
<text x="1200" y="692" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">10 / 12</text>
</svg>
