<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" opacity="1.0"/>
<text x="80" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="2" opacity="1.0">05 / 12</text>
<text x="1200" y="74" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">CHRONOLOGY</text>
<line x1="80" y1="96" x2="1200" y2="96" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="176" font-family="华文楷体" font-size="54" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">年表</text>
<line x1="300" y1="200" x2="300" y2="620" stroke="#D9D9D4" stroke-width="1"/>
<text x="268" y="232" font-family="Arial" font-size="20" font-weight="400" fill="#111111" text-anchor="end" letter-spacing="0" opacity="1.0">1899</text>
<circle cx="300" cy="225" r="3" fill="#111111"/>
<text x="340" y="232" font-family="华文中宋" font-size="20" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">出生于江苏武进（今常州）</text>
<text x="268" y="284" font-family="Arial" font-size="20" font-weight="400" fill="#111111" text-anchor="end" letter-spacing="0" opacity="1.0">1917</text>
<circle cx="300" cy="277" r="3" fill="#111111"/>
<text x="340" y="284" font-family="华文中宋" font-size="20" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">入北京俄文专修馆学习</text>
<text x="268" y="336" font-family="Arial" font-size="20" font-weight="400" fill="#111111" text-anchor="end" letter-spacing="0" opacity="1.0">1919</text>
<circle cx="300" cy="329" r="3" fill="#111111"/>
<text x="340" y="336" font-family="华文中宋" font-size="20" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">参加五四运动，与郑振铎等创办《新社会》</text>
<text x="268" y="388" font-family="Arial" font-size="20" font-weight="400" fill="#111111" text-anchor="end" letter-spacing="0" opacity="1.0">1920</text>
<circle cx="300" cy="381" r="3" fill="#111111"/>
<text x="340" y="388" font-family="华文中宋" font-size="20" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">任《晨报》特派记者，赴苏俄</text>
<text x="268" y="440" font-family="Arial" font-size="20" font-weight="400" fill="#111111" text-anchor="end" letter-spacing="0" opacity="1.0">1922</text>
<circle cx="300" cy="433" r="3" fill="#111111"/>
<text x="340" y="440" font-family="华文中宋" font-size="20" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">在莫斯科加入中国共产党</text>
<text x="268" y="492" font-family="Arial" font-size="20" font-weight="400" fill="#111111" text-anchor="end" letter-spacing="0" opacity="1.0">1927</text>
<circle cx="300" cy="485" r="3" fill="#111111"/>
<text x="340" y="492" font-family="华文中宋" font-size="20" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">主持中央政治局，担负直接政治领导</text>
<text x="268" y="544" font-family="Arial" font-size="20" font-weight="400" fill="#111111" text-anchor="end" letter-spacing="0" opacity="1.0">1931</text>
<circle cx="300" cy="537" r="3" fill="#111111"/>
<text x="340" y="544" font-family="华文中宋" font-size="20" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0" opacity="1.0">被解除中央领导职务，转入左翼文化运动</text>
<text x="268" y="596" font-family="Arial" font-size="20" font-weight="400" fill="#E2231A" text-anchor="end" letter-spacing="0" opacity="1.0">1935</text>
<circle cx="300" cy="589" r="5" fill="#E2231A"/>
<text x="340" y="596" font-family="华文中宋" font-size="20" font-weight="400" fill="#E2231A" text-anchor="start" letter-spacing="0" opacity="1.0">六月十八日，就义于福建长汀中山公园</text>
<line x1="80" y1="664" x2="1200" y2="664" stroke="#D9D9D4" stroke-width="1"/>
<text x="80" y="692" font-family="华文中宋" font-size="13" font-weight="400" fill="#767674" text-anchor="start" letter-spacing="1" opacity="1.0">多余的话</text>
<text x="1200" y="692" font-family="Arial" font-size="13" font-weight="400" fill="#767674" text-anchor="end" letter-spacing="2" opacity="1.0">05 / 12</text>
</svg>
